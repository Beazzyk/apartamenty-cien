name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy create-booking     --project-ref wjskjpxxjbrclqugnqax --no-verify-jwt
          supabase functions deploy check-availability --project-ref wjskjpxxjbrclqugnqax --no-verify-jwt
          supabase functions deploy ical-feed          --project-ref wjskjpxxjbrclqugnqax --no-verify-jwt
          supabase functions deploy manage-booking     --project-ref wjskjpxxjbrclqugnqax --no-verify-jwt
